<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sound Test</title>
<style>
:root{--bg:#fff8ee;--ink:#2b2118;--muted:#7a6a5a;--card:#fff;--line:#eadfce;--go:#2f8f4e;--no:#c0412f;--accent:#2c5d8f}
@media (prefers-color-scheme:dark){:root{--bg:#1d1813;--ink:#f3eadf;--muted:#b3a493;--card:#2a231c;--line:#3b3229}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:15px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pick button{font:700 26px/1 Georgia,serif;min-width:58px;padding:12px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pick button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.big{display:block;width:100%;padding:18px;border:0;border-radius:16px;background:var(--go);color:#fff;font:700 22px/1 -apple-system,system-ui,sans-serif;margin:10px 0}
.big:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.target{font:700 64px/1 Georgia,serif;text-align:center;margin:6px 0}
ul{margin:6px 0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.y{color:var(--go);font-weight:700}.n{color:var(--no);font-weight:700}
</style>
</head>
<body>
<main>
<h1>Sound Test</h1>
<p class="muted">Can the iPhone's built-in speech recognition hear a single reading sound? Pick a sound, tap Listen, and say it (hold the long ones for 2 seconds). This shows exactly what the phone heard.</p>

<div class="pick" id="pick"></div>
<div class="card"><div class="target" id="target">m</div><p class="muted" id="how" style="text-align:center"></p></div>
<button class="big" id="go">🎤 Listen</button>
<div class="card"><b>The phone heard:</b><ul id="heard"><li class="muted">Nothing yet</li></ul></div>
<div class="card"><b>Results so far</b><table id="log"></table></div>
<p class="muted" id="warn"></p>
</main>
<script>
const SOUNDS = {
  m:['mmm (lips closed, hum)',['m','mm','mmm','hmm','em','um']],
  s:['sss (like a snake)',['s','ss','sss','ess','shh']],
  a:['a as in apple',['a','ah','aa','eh']],
  f:['fff (top teeth on lip)',['f','ff','fff','ef']],
  t:['t (quick, no “tuh”)',['t','tea','tee','ta']],
  n:['nnn (hum through nose)',['n','nn','nnn','en','in']],
  r:['rrr (growl)',['r','rr','rrr','are','er']],
  i:['i as in itch',['i','ih','e']],
  d:['d (quick, no “duh”)',['d','dee','the']],
  o:['o as in octopus',['o','oh','ah','awe']],
  sh:['shhh (be quiet)',['sh','shh','shhh']],
  ee:['eee as in see',['e','ee','eee','e e']],
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let cur = 'm';
const $ = id => document.getElementById(id);
for (const k of Object.keys(SOUNDS)) {
  const b = document.createElement('button');
  b.textContent = k; b.onclick = () => choose(k); b.id = 'p_' + k;
  $('pick').appendChild(b);
}
function choose(k){ cur=k; document.querySelectorAll('.pick button').forEach(x=>x.classList.toggle('on', x.id==='p_'+k)); $('target').textContent=k; $('how').textContent='Say: '+SOUNDS[k][0]; }
choose('m');
if (!SR) { $('go').disabled = true; $('warn').textContent = 'This browser has no speech recognition. Open this page in Safari on the iPhone.'; }
const norm = s => s.toLowerCase().replace(/[^a-z ]/g,'').trim();
$('go').onclick = () => {
  const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
  const got = []; const want = cur;
  $('go').disabled = true; $('go').textContent = '👂 Listening… say it now';
  $('heard').innerHTML = '';
  const stop = setTimeout(()=>{ try{r.stop()}catch{} }, 5000);
  r.onresult = e => { for (const res of e.results) for (const alt of res) got.push(alt.transcript); };
  r.onerror = e => got.push('(error: '+e.error+')');
  r.onend = () => {
    clearTimeout(stop);
    $('go').disabled = false; $('go').textContent = '🎤 Listen';
    $('heard').innerHTML = got.length ? got.map(g=>'<li>“'+g.replace(/</g,'&lt;')+'”</li>').join('') : '<li class="muted">(nothing at all)</li>';
    const ok = got.some(g => SOUNDS[want][1].includes(norm(g)));
    const row = document.createElement('tr');
    row.innerHTML = '<td><b>'+want+'</b></td><td>'+(got[0]?'“'+got[0].replace(/</g,'&lt;')+'”':'(nothing)')+'</td><td class="'+(ok?'y">✓ close':'n">✗')+'</td>';
    $('log').prepend(row);
  };
  try { r.start(); } catch(e) { clearTimeout(stop); $('go').disabled=false; $('go').textContent='🎤 Listen'; }
};
</script>
</body>
</html>
